name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Build smoke test — pas besoin des vraies clés ici, juste vérifier
          # que la compilation passe. La PR aura accès aux secrets seulement
          # sur le job de deploy (workflow_dispatch ou push to main).
          VITE_FIREBASE_API_KEY: stub
          VITE_FIREBASE_AUTH_DOMAIN: stub.firebaseapp.com
          VITE_FIREBASE_DATABASE_URL: https://stub.firebaseio.com
          VITE_FIREBASE_PROJECT_ID: stub
          VITE_FIREBASE_STORAGE_BUCKET: stub.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000'
          VITE_FIREBASE_APP_ID: stub
