<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover + user-scalable=no : optimisé pour iOS Safari (notch,
       pas de pinch-zoom qui casse le canvas). À garder pour la portabilité
       mobile via Capacitor. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>GMMN</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-color: #000;
    }
    canvas { display: block; touch-action: none; }
    /* Masque l'overlay "loading…" natif de p5.js */
    #p5_loading { display: none !important; }
  </style>
</head>
<body>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
